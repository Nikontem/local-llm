[project]
name = "local-llm"
version = "0.1.0"
description = "Get llama.cpp serving models on your machine in one guided session, and wire your coding agents to it."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "nikosntemkas" }]
dependencies = [
  "typer>=0.15",
  "rich>=13",
  "huggingface_hub>=0.30",
  "psutil>=6",
  "tomlkit>=0.13",
]

[project.scripts]
local-llm = "local_llm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_llm"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["live: needs network access to huggingface.co"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The scripts under demo/ build the README's recordings; they are throwaway tools
# for making videos, not part of the package, and holding them to the package's
# lint rules only ever produces noise in a `ruff check .` of the whole tree.
exclude = ["demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
